<!doctype html>
<!--
  Template for the static social images (Open Graph + apple-touch-icon).
  Regenerate after changing the hero title or description:
    ?lang=en  → app/(en)/opengraph-image.png      (1200×630)
    ?lang=es  → app/(es)/es/opengraph-image.png   (1200×630)
    ?icon     → app/apple-icon.png                (180×180)
  Screenshot the #card element at deviceScaleFactor 1.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet">
<style>
  body { margin: 0; background: #FBFBFA; }
  #card { width: 1200px; height: 630px; box-sizing: border-box; padding: 80px; display: flex; flex-direction: column; justify-content: space-between; background: #FBFBFA; color: #16181D; font-family: Inter, sans-serif; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mono { width: 72px; height: 72px; border-radius: 18px; background: #16181D; color: #fff; display: flex; align-items: center; justify-content: center; font: 700 30px 'Space Grotesk', sans-serif; }
  .name { font-weight: 600; font-size: 32px; }
  .badge { display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: #EAF7EF; color: #17663A; font-size: 22px; font-weight: 500; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #1F9D55; }
  h1 { margin: 0; font: 600 74px/1.04 'Space Grotesk', sans-serif; letter-spacing: -0.03em; max-width: 1000px; text-wrap: balance; }
  .lead { margin: 0; font-size: 28px; line-height: 1.5; color: #4A4F5A; max-width: 980px; }
  .foot { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; color: #1F4FD8; }
  .bar { width: 56px; height: 8px; border-radius: 4px; background: #1F4FD8; }
  #card.icon { width: 180px; height: 180px; padding: 0; align-items: center; justify-content: center; background: #16181D; color: #fff; font: 700 76px 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const copy = {
    en: { badge: "Open to new projects", title: "I build reliable software, end to end.", lead: "Full-stack engineer with 10+ years shipping .NET backends, React frontends and mobile apps." },
    es: { badge: "Disponible para nuevos proyectos", title: "Construyo software confiable, de principio a fin.", lead: "Ingeniero full-stack con más de 10 años creando backends en .NET, frontends en React y apps móviles." },
  };
  const params = new URLSearchParams(location.search);
  const card = document.getElementById("card");
  if (params.has("icon")) {
    card.className = "icon";
    card.textContent = "RS";
  } else {
    const c = copy[params.get("lang") || "en"];
    card.innerHTML = `
      <div class="brand"><div class="mono">RS</div><div class="name">Rubén Saavedra</div></div>
      <div style="display:flex;flex-direction:column;gap:26px">
        <span class="badge"><span class="dot"></span>${c.badge}</span>
        <h1>${c.title}</h1>
        <p class="lead">${c.lead}</p>
      </div>
      <div class="foot"><div class="bar"></div>rubensaavedra.net</div>`;
  }
</script>
</body>
</html>
